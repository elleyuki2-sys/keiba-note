name: Update JRA schedule

on:
  # JRA's planned daily program is stable enough to update once a week.
  # The workflow can also be started manually from GitHub Actions.
  schedule:
    - cron: "0 8 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update schedule JSON safely
        run: python3 tools/update_schedule.py

      - name: Commit changes when the JSON actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jra-schedule.json
          if git diff --cached --quiet; then
            echo "No schedule changes. Existing JSON remains unchanged."
            exit 0
          fi
          git commit -m "Update JRA schedule data"
          git push
