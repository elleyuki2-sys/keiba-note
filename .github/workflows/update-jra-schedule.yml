name: Update JRA schedule

on:
  # Run daily at 10:00 JST. Future dates are not required; the updater
  # refreshes today and the previous 7 days so same-day accounting works.
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update schedule JSON safely
        run: python3 tools/update_schedule.py

      - name: Commit changes when the JSON actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jra-schedule.json
          if git diff --cached --quiet; then
            echo "No schedule changes. Existing JSON remains unchanged."
            exit 0
          fi
          git commit -m "Update JRA schedule data"
          git push
