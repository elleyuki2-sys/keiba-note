name: Update JRA schedule
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update schedule JSON
        run: python3 tools/update_schedule.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jra-schedule.json
          if git diff --cached --quiet; then echo "No schedule changes."; exit 0; fi
          git commit -m "Update JRA schedule data"
          git push
