<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEIBA NOTE V5.1.3</title><link rel="stylesheet" href="style.css?v=5.1.3"></head><body>
<header><div><small>KEIBA NOTE V5.1.3</small><h1>競馬収支管理</h1></div><div class="headerActions"><span id="syncStatus" class="syncStatus">ローカル保存</span><button id="add">＋ 収支を記録</button></div></header>
<main>
<section class="panel cloudPanel" id="cloudPanel"><div class="head"><div><h2>☁️ PC・iPhone同期</h2><p id="authMessage" class="muted">Supabaseに接続すると、PCとiPhoneで同じ収支データを利用できます。</p></div><div id="accountArea"></div></div><div id="authBox" class="authBox"><div class="authForm"><label>メールアドレス<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label><label>パスワード<input id="password" type="password" autocomplete="current-password" placeholder="6文字以上"></label><div class="authButtons"><button id="signIn" class="primary">ログイン</button><button id="signUp">新規登録</button></div></div><small class="muted">初回はSupabase側のメール確認が必要になる場合があります。</small></div></section>
<section class="summary" id="summary"></section>
<section class="panel"><div class="head"><h2 id="periodTitle">今月の成績</h2><div class="tabs"><button class="tab active" data-period="month">月</button><button class="tab" data-period="year">年</button></div></div><div class="monthly" id="periodStats"></div></section>
<section class="panel"><h2>② 馬券種別の成績</h2><div class="bets" id="bets"></div></section>
<section class="panel"><h2>⑤ 競馬場別成績</h2><div class="courseGrid" id="courses"></div></section>
<section class="panel"><div class="head"><h2>④ 月別収支グラフ</h2><select id="months"><option value="6">直近6か月</option><option value="12">直近12か月</option></select></div><canvas id="chart"></canvas></section>
<section class="panel"><div class="head"><h2>⑦ 収支カレンダー</h2><div class="calendarNav"><button id="prevMonth">‹</button><b id="calendarTitle"></b><button id="nextMonth">›</button></div></div><div id="calendar" class="calendar"></div></section>
<section class="panel"><h2>⑧ 的中率・回収率ランキング</h2><div class="rankGrid"><div><h3>回収率</h3><div id="returnRank"></div></div><div><h3>的中率</h3><div id="hitRank"></div></div></div></section>
<section class="panel"><div class="head"><h2>データ管理</h2><div class="dataButtons"><button id="exportData">バックアップ保存</button><button id="importData">バックアップ復元</button><input id="fileInput" type="file" accept="application/json" hidden><button id="clear" class="text">全データ削除</button></div></div><p class="muted">バックアップは端末にも保存できます。クラウド同期中でも、念のため定期的なバックアップをおすすめします。</p></section>
<section class="panel"><div class="head"><h2>収支履歴</h2></div><div id="records"></div></section>
</main>
<div id="modal" class="modal hide"><div class="box"><div class="head"><h2 id="mtitle">収支を記録</h2><button id="close">×</button></div><form id="form"><div class="form"><label>日付<input id="date" type="date" required></label><label>競馬場<select id="course" required><option value="">選択</option><option>札幌</option><option>函館</option><option>福島</option><option>新潟</option><option>東京</option><option>中山</option><option>中京</option><option>京都</option><option>阪神</option><option>小倉</option><option>その他</option></select></label><label>レース<input id="race" type="number" min="1" max="12" required></label><label>馬券種<select id="type"><option>複勝</option><option>ワイド</option><option>単勝</option><option>馬連</option><option>馬単</option><option>三連複</option><option>三連単</option><option>その他</option></select></label><label>購入金額<input id="inv" type="number" min="0" step="100" required></label><label>払戻金額<input id="ret" type="number" min="0" step="10" required></label><label class="full">メモ<input id="memo" maxlength="100"></label></div><button class="save" id="save" type="submit">記録する</button></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=5.1.3"></script><script src="app.js?v=5.1.3"></script></body></html>
